<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LOGIN OVERLAY (100% Blickdicht) --- */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #111; /* Vollständig deckend */
            z-index: 9999; /* Ganz oben */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #222;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #444;
            text-align: center;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .login-box h2 { margin-top: 0; color: #fff; }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .login-box button:hover { background: #0056b3; }

        .error-msg {
            color: #ff5555;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
            background: rgba(255,0,0,0.1);
            padding: 5px;
            border-radius: 4px;
        }


        /* --- HAUPT INTERFACE --- */
        h2.main-title { margin: 10px; }

        .video-container {
            width: 100%; max-width: 1280px; aspect-ratio: 16/9;
            background: #000; border: 2px solid #333; position: relative; user-select: none;
        }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; }

        .control-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; cursor: crosshair; display: block;
        }

        .ui-panel {
            margin-top: 15px; display: flex; gap: 30px;
            align-items: flex-start; background: #222;
            padding: 15px 25px; border-radius: 8px;
        }
        .mode-switch label { cursor: pointer; display: block; margin-bottom: 5px; }
        .info-group { border-left: 1px solid #444; padding-left: 20px; }

        /* Joystick Styles */
        #joystick-wrapper {
            margin-top: 20px; display: none; position: relative;
            width: 200px; height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; border: 2px solid #555; touch-action: none;
        }
        #joystick-knob {
            width: 60px; height: 60px; background: #007bff;
            border-radius: 50%; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            cursor: grab;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>System Login</h2>
            <input type="text" id="userInput" placeholder="Benutzername" autocomplete="off">
            <input type="password" id="passInput" placeholder="Passwort">
            <button onclick="performLogin()">Verbinden</button>
            <div class="error-msg" id="loginError">Zugangsdaten falsch!</div>
        </div>
    </div>

    <h2 class="main-title">Roboter Steuerung v2</h2>

    <div class="video-container">
        <div class="control-layer" id="mouseZone"></div>
        <iframe id="camStream" src=""></iframe>
    </div>

    <div class="ui-panel">
        <div class="mode-switch">
            <div style="margin-bottom:5px; color:#aaa; font-size:0.8rem;">STEUERUNG</div>
            <label><input type="radio" name="controlMode" value="mouse" checked onchange="setMode('mouse')"> Maus</label>
            <label><input type="radio" name="controlMode" value="joystick" onchange="setMode('joystick')"> Joystick</label>
        </div>
        <div class="info-group">
            <div style="font-weight:bold;">Status: <span id="connectionStatus" style="color:red">Getrennt</span></div>
            <div style="margin-top:5px;">User: <span id="displayUser">-</span></div>
        </div>
    </div>

    <div id="joystick-wrapper"><div id="joystick-knob"></div></div>
    <p id="instructionText">Halte die linke Maustaste im Video gedrückt.</p>

    <script>
        const host = window.location.hostname;

        // Globale Variablen
        let currentPan = 90;
        let currentTilt = 90;
        let isLoggedIn = false;

        const ws = new WebSocket(`ws://${host}:8080/ws`);
        const statusEl = document.getElementById('connectionStatus');

        // --- LOGIN LOGIK ---
        function performLogin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;

            // Error-Box erst mal ausblenden, neuer Versuch
            document.getElementById('loginError').style.display = 'none';

            if(ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'login', user: u, pass: p }));
            } else {
                alert("Keine Verbindung zum Server! Bitte Seite neu laden.");
            }
        }

        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performLogin();
        });

        // --- WEBSOCKET EVENT HANDLING ---
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'login_success') {
                document.getElementById('loginOverlay').style.display = 'none';
                if (data.stream_url) {
                    document.getElementById('camStream').src = data.stream_url;
                }
                document.getElementById('displayUser').innerText = data.user;
                isLoggedIn = true;
                statusEl.innerText = "Verbunden";
                statusEl.style.color = "#0f0";

            } else if (data.type === 'login_fail') {
                const errBox = document.getElementById('loginError');

                // HIER IST DIE WICHTIGE ÄNDERUNG:
                // Wir prüfen, ob der Server eine spezielle Nachricht geschickt hat.
                // Dein Python-Script sendet z.B. "System ist belegt!" oder gar nichts (bei falschem PW).
                if (data.message) {
                    errBox.innerText = data.message;
                } else {
                    errBox.innerText = "Zugangsdaten falsch!";
                }

                errBox.style.display = 'block';

                // Animation neu triggern
                const box = document.querySelector('.login-box');
                box.style.animation = 'none';
                box.offsetHeight; /* Trigger reflow */
                box.style.animation = "shake 0.5s";
            }
        };

        ws.onclose = () => {
            statusEl.innerText = "Getrennt";
            statusEl.style.color = "#f00";
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('camStream').src = "";

            // Optional: Reset des Error-Textes für den nächsten Versuch
            document.getElementById('loginError').innerText = "Verbindung verloren.";
            document.getElementById('loginError').style.display = 'block';

            isLoggedIn = false;
        };

        // --- SENDE FUNKTION (unverändert) ---
        let lastSend = 0;
        function sendAngles(pan, tilt) {
            if (!isLoggedIn) return;

            pan = Math.max(0, Math.min(180, pan));
            tilt = Math.max(0, Math.min(180, tilt));
            currentPan = pan;
            currentTilt = tilt;

            const now = Date.now();
            if (now - lastSend < 40) return;
            lastSend = now;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ pan: pan, tilt: tilt }));
            }
        }

        // --- STEUERUNG (unverändert) ---
        const mouseZone = document.getElementById('mouseZone');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const instructionText = document.getElementById('instructionText');
        const knob = document.getElementById('joystick-knob');
        let currentMode = 'mouse';
        let isDraggingJoystick = false;
        let joyX = 0, joyY = 0;
        const keyState = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'mouse') {
                mouseZone.style.display = 'block';
                joystickWrapper.style.display = 'none';
                instructionText.innerText = "Halte die linke Maustaste im Video gedrückt.";
            } else {
                mouseZone.style.display = 'none';
                joystickWrapper.style.display = 'block';
                instructionText.innerText = "Benutze Joystick oder Pfeiltasten.";
            }
        }

        mouseZone.addEventListener('mousemove', (e) => {
            if (e.buttons !== 1) return;
            const rect = mouseZone.getBoundingClientRect();
            const panPct = (e.clientX - rect.left) / rect.width;
            const tiltPct = (e.clientY - rect.top) / rect.height;
            sendAngles(180 - (panPct * 180), 180 - (tiltPct * 180));
        });
        mouseZone.addEventListener('dragstart', (e) => e.preventDefault());

        setInterval(() => {
            const isKeysActive = keyState.ArrowUp || keyState.ArrowDown || keyState.ArrowLeft || keyState.ArrowRight;
            if (currentMode === 'joystick' && (isDraggingJoystick || isKeysActive)) {
                let deltaPan = joyX * 4.0 * -1;
                let deltaTilt = joyY * 4.0 * -1;
                sendAngles(currentPan + deltaPan, currentTilt + deltaTilt);
            }
        }, 50);

        window.addEventListener('keydown', (e) => {
            if(document.activeElement.tagName === 'INPUT') return;
            if (keyState.hasOwnProperty(e.key)) { keyState[e.key] = true; updateJoy(); }
        });
        window.addEventListener('keyup', (e) => {
            if (keyState.hasOwnProperty(e.key)) { keyState[e.key] = false; updateJoy(); }
        });

        function updateJoy() {
            if (isDraggingJoystick) return;
            joyX = (keyState.ArrowRight ? 1 : 0) - (keyState.ArrowLeft ? 1 : 0);
            joyY = (keyState.ArrowDown ? 1 : 0) - (keyState.ArrowUp ? 1 : 0);
            knob.style.transform = `translate(calc(-50% + ${joyX*70}px), calc(-50% + ${joyY*70}px))`;
        }

        knob.addEventListener('mousedown', startJ); knob.addEventListener('touchstart', startJ);
        window.addEventListener('mousemove', moveJ); window.addEventListener('touchmove', moveJ);
        window.addEventListener('mouseup', endJ); window.addEventListener('touchend', endJ);

        function startJ(e) { if(currentMode==='joystick'){ isDraggingJoystick=true; knob.style.transition='none'; e.preventDefault(); }}
        function moveJ(e) {
            if(!isDraggingJoystick) return;
            e.preventDefault();
            let cX = e.touches ? e.touches[0].clientX : e.clientX;
            let cY = e.touches ? e.touches[0].clientY : e.clientY;
            let rect = joystickWrapper.getBoundingClientRect();
            let dX = cX - (rect.left + rect.width/2), dY = cY - (rect.top + rect.height/2);
            let dist = Math.sqrt(dX*dX + dY*dY);
            if(dist > 70) { let ang = Math.atan2(dY, dX); dX = Math.cos(ang)*70; dY = Math.sin(ang)*70; }
            knob.style.transform = `translate(calc(-50% + ${dX}px), calc(-50% + ${dY}px))`;
            joyX = dX/70; joyY = dY/70;
        }
        function endJ() { isDraggingJoystick=false; knob.style.transition='transform 0.1s'; knob.style.transform='translate(-50%,-50%)'; joyX=0; joyY=0; updateJoy(); }
    </script>
</body>
</html>
