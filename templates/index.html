<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control v2</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-left">
            <div class="logo-placeholder">RB</div>
            <div class="header-title">Robot Control</div>
        </div>
        <div class="header-right">
            <button class="settings-btn" onclick="openSettings()">Settings</button>
        </div>
    </header>

    <div id="loginOverlay" class="overlay">
        <div class="box login-box">
            <h2>System Login</h2>
            <input type="text" id="userInput" placeholder="Benutzername" autocomplete="off">
            <input type="password" id="passInput" placeholder="Passwort">
            <button onclick="performLogin()">Verbinden</button>
        </div>
    </div>

    <div id="settingsOverlay" class="overlay" style="display: none;">
    <div class="box settings-box">
        <span class="close-icon" onclick="closeSettings()">&times;</span>
        <h1>Einstellungen</h1>

        <div class="settings-section">
            <h2>Passwort ändern</h2>
            <input type="password" id="oldPass" placeholder="Altes Passwort">
            <input type="password" id="newPass" placeholder="Neues Passwort">
            <button onclick="changePassword()">Passwort speichern</button>
        </div>

        <div id="adminArea" style="display: none; border-top: 1px solid #444; margin-top: 20px; padding-top: 15px;">
            <h2>System-Konfiguration (Admin)</h2>

            <div class="settings-group">
                <h4>Servos (Pan/Tilt)</h4>
                <div class="admin-grid">
                    <label>Pan Channel: <input type="number" id="cfg-pan-ch"></label>
                    <label>Tilt Channel: <input type="number" id="cfg-tilt-ch"></label>

                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-pan-rev"> Pan umkehren
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-tilt-rev"> Tilt umkehren
                    </label>

                    <label>Pan Min: <input type="number" id="cfg-pan-min"></label>
                    <label>Pan Max: <input type="number" id="cfg-pan-max"></label>
                    <label>Tilt Min: <input type="number" id="cfg-tilt-min"></label>
                    <label>Tilt Max: <input type="number" id="cfg-tilt-max"></label>
                </div>
            </div>

            <div class="settings-group">
                <h4>OLED Display Pins</h4>
                <div class="admin-grid">
                    <label>I2C Adr: <input type="text" id="cfg-oled-addr"></label>
                    <label>Pin CLK: <input type="number" id="cfg-oled-clk"></label>
                    <label>Pin DT: <input type="number" id="cfg-oled-dt"></label>
                    <label>Pin SW: <input type="number" id="cfg-oled-sw"></label>
                </div>
            </div>

            <div class="settings-group">
                <h4>Netzwerk & Sicherheit</h4>
                <div class="admin-grid">
                    <label>Server Port: <input type="number" id="cfg-net-port"></label>
                    <label>go2RTC Token: <input type="text" id="cfg-sec-token"></label>
                </div>
            </div>

            <button class="admin-save-btn" onclick="saveAdminConfig()">Gesamte Konfiguration speichern</button>
        </div>

        <button class="secondary" onclick="closeSettings()">Abbrechen</button>
    </div>
</div>

    <div class="main-content">
        <div class="video-container">
            <div class="control-layer" id="mouseZone"></div>
            <iframe id="camStream" src=""></iframe>
        </div>

        <div class="status-panel">
            <div>Status: <span id="connectionStatus" style="color:red">Getrennt</span></div>
            <div>User: <span id="displayUser">-</span></div>
        </div>

        <div id="joystick-wrapper">
            <div id="joystick-knob"></div>
        </div>

        <div class="hint">
            Steuerung: Klicken & Ziehen im Video,<br>
            Joystick benutzen oder Pfeiltasten verwenden.
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
